<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — VELNOVA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav-ph"></div>

<section style="padding-top:calc(var(--nav-h) + 48px);">
  <div class="container">
    <div class="breadcrumb" style="margin-bottom:36px;">
      <a href="index.html">Home</a><span>/</span>
      <a href="shop.html">Shop</a><span>/</span>
      <span id="pd-name-bc">Product</span>
    </div>
    <div class="pd-wrap">
      <!-- Gallery -->
      <div class="pd-gallery">
        <div class="pd-main"><img id="pd-main-img" src="" alt="Product"></div>
        <div class="pd-thumbs" id="pd-thumbs"></div>
      </div>
      <!-- Info -->
      <div class="pd-info">
        <div class="eyebrow pd-cat" id="pd-cat" style="color:var(--grey-400);margin-bottom:8px;"></div>
        <h1 class="pd-name" id="pd-name">Loading...</h1>
        <div class="pd-price" id="pd-price"></div>
        <p class="pd-desc" id="pd-desc"></p>
        <hr class="pd-divider">
        <div class="size-row-hdr">
          <span class="eyebrow" style="font-size:0.68rem;">Select Size</span>
          <span class="size-guide-link">Size Guide</span>
        </div>
        <div class="sizes" id="pd-sizes"></div>
        <hr class="pd-divider">
        <div class="qty-row">
          <div class="qty-ctrl">
            <button class="qty-btn" id="qty-minus">−</button>
            <div class="qty-num" id="qty-num">1</div>
            <button class="qty-btn" id="qty-plus">+</button>
          </div>
          <button class="btn btn-dark btn-lg" style="flex:1;" id="add-to-cart">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
            Add to Cart
          </button>
        </div>
        <a href="cart.html" class="btn btn-outline btn-full" style="margin-bottom:24px;">View Cart</a>
        <hr class="pd-divider">
        <div style="display:flex;flex-direction:column;gap:10px;">
          <div style="display:flex;gap:10px;align-items:center;font-size:0.82rem;color:var(--grey-600);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12l5 5L20 7"/></svg>
            Free delivery on orders above ₦50,000
          </div>
          <div style="display:flex;gap:10px;align-items:center;font-size:0.82rem;color:var(--grey-600);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12l5 5L20 7"/></svg>
            Bank transfer payment — simple & secure
          </div>
          <div style="display:flex;gap:10px;align-items:center;font-size:0.82rem;color:var(--grey-600);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12l5 5L20 7"/></svg>
            Email us: velnovaclothing@gmail.com
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Related -->
<section style="background:var(--grey-50);">
  <div class="container">
    <div class="sec-hdr fade-in">
      <div class="sec-hdr-l">
        <div class="eyebrow">You May Also Like</div>
        <h2>Related Pieces</h2>
      </div>
      <a href="shop.html" class="sec-link">View All <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></a>
    </div>
    <div class="products-grid" id="related-grid"></div>
  </div>
</section>

<div id="footer-ph"></div>
<script src="js/layout.js"></script>
<script src="js/script.js"></script>
</body>
</html>
