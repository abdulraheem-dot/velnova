<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — VELNOVA</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="nav-ph"></div>

<div class="page-hdr">
  <div class="label-text" style="color:var(--grey-400);margin-bottom:8px">Your Selection</div>
  <h1>Shopping Cart</h1>
  <div class="breadcrumb"><a href="/">Home</a><span>/</span><span>Cart</span></div>
</div>

<section>
  <div class="wrap">
    <div class="cart-layout">
      <div id="cart-container"></div>
      <div id="cart-sum-area"></div>
    </div>
  </div>
</section>

<section style="background:var(--grey-50);padding:40px 0">
  <div class="wrap">
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;text-align:center">
      <div>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin:0 auto 10px;display:block"><path d="M5 8h14M5 8a2 2 0 100-4h14a2 2 0 100 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8"/></svg>
        <div class="label-text" style="margin-bottom:4px">Nationwide Delivery</div>
        <p style="font-size:.8rem;color:var(--grey-600)">We deliver across all states in Nigeria</p>
      </div>
      <div>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin:0 auto 10px;display:block"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        <div class="label-text" style="margin-bottom:4px">Secure Payment</div>
        <p style="font-size:.8rem;color:var(--grey-600)">Direct bank transfer — safe and simple</p>
      </div>
      <div>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin:0 auto 10px;display:block"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 014.75 12"/></svg>
        <div class="label-text" style="margin-bottom:4px">Support</div>
        <p style="font-size:.8rem;color:var(--grey-600)">velnovaclothing@gmail.com</p>
      </div>
    </div>
  </div>
</section>

<div id="footer-ph"></div>
<script src="/js/layout.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
